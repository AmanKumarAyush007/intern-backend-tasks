name: Backend Task CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'submissions/**'

jobs:
  verify:
    name: Verify Submission
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:alpine
        ports: ['6379:6379']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Detect changed exercise
        id: detect
        run: |
          CHANGED=$(git diff --name-only origin/main...HEAD | grep 'submissions/' | head -1)
          echo "changed=$CHANGED" >> $GITHUB_OUTPUT
          USER=$(echo $CHANGED | cut -d'/' -f2)
          echo "user=$USER" >> $GITHUB_OUTPUT
          EXERCISE=$(echo $CHANGED | cut -d'/' -f3)
          echo "exercise=$EXERCISE" >> $GITHUB_OUTPUT

      - name: Install base dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Django>=4.2 djangorestframework django-filter \
                      djangorestframework-simplejwt celery redis \
                      tenacity requests flake8

      - name: Lint with flake8
        run: |
          flake8 submissions/${{ steps.detect.outputs.user }}/${{ steps.detect.outputs.exercise }}/ \
            --max-line-length=120 \
            --exclude=migrations \
            --count --statistics
        continue-on-error: true  # Don't fail on style warnings

      - name: Run verifier
        run: |
          python scripts/verify.py \
            --exercise ${{ steps.detect.outputs.exercise }} \
            --user ${{ steps.detect.outputs.user }}
